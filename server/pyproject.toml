[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "atelier-pcb"
version = "0.1.0"
description = "Serveur MCP pour piloter KiCad et générer/vérifier des boîtiers imprimés en 3D"
requires-python = ">=3.11"
dependencies = [
  "mcp>=2.3,<3",
  "kicad-python>=0.8,<0.9",   # API IPC, alignée sur KiCad 10.0.x
  "build123d>=0.13,<0.14",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
atelier-server = "atelier.server:main"

[tool.setuptools.packages.find]
include = ["atelier*"]

[tool.setuptools.package-data]
atelier = ["viewer/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
