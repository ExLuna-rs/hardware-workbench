[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:xvfb]
command=/usr/bin/Xvfb :1 -screen 0 %(ENV_RESOLUTION)sx24 -nolisten tcp
user=ubuntu
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:openbox]
command=/usr/bin/openbox-session
user=ubuntu
environment=HOME="/home/ubuntu",DISPLAY=":1"
priority=20
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:x11vnc]
; VNC uniquement en local dans le conteneur : seul noVNC (6080) est exposé
command=/usr/bin/x11vnc -display :1 -forever -shared -localhost -rfbport 5900 -rfbauth /home/ubuntu/.vnc/passwd -noxdamage -quiet
user=ubuntu
priority=30
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:novnc]
command=/usr/bin/websockify --web /usr/share/novnc 6080 localhost:5900
user=ubuntu
priority=40
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:kicad]
command=/bin/sh -c 'sleep 2; exec kicad ${KICAD_PROJECT}'
user=ubuntu
environment=HOME="/home/ubuntu",DISPLAY=":1"
priority=50
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
